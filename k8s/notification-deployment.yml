apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  labels:
    name:  notification-deployment
spec:
  replicas:  1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - image:  notification
        imagePullPolicy: IfNotPresent
        name:  notification-server
        resources:
          requests:
            cpu: "150m"
            memory: "100M"
          limits:
            cpu: "300m"
            memory: "200M"
        livenessProbe:
          httpGet:
            path: /status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
          - name: RABBITMQ_URL
            valueFrom:
              secretKeyRef:
                name: database
                key: RABBITMQ_URL
          - name: GOOGLE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: google
                key: GOOGLE_CLIENT_ID
          - name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: google
                key: GOOGLE_CLIENT_SECRET
          - name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                name: google
                key: EMAIL_USER
          - name: REFRESH_TOKEN
            valueFrom:
              secretKeyRef:
                name: google
                key: REFRESH_TOKEN
        ports:
        - containerPort:  3000
          name:  http-notification
          
          
        
              
       